[project]
name = "looker-demo-cli"
version = "0.1.6"
description = "Deterministic Looker Demo Orchestrator CLI for synthetic data generation, BigQuery upload, LookML modeling, and Embedded Portal scaffolding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pydantic>=2.7.0",
    "google-cloud-bigquery>=3.20.0",
    "google-auth>=2.29.0",
    "looker-sdk>=24.4.0",
    "lkr-dev-cli[all]>=0.0.50",
    "mcp<2",
    "pydantic-monty<0.0.10",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
demo-create = "looker_demo_cli.cli:app"
looker-demo-cli = "looker_demo_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
