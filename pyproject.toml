[project]
name = "looker-demo-cli"
version = "0.3.0"
description = "Deterministic Looker Demo Orchestrator CLI for synthetic data generation, BigQuery upload, LookML modeling, and Embedded Portal scaffolding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pydantic>=2.7.0",
    "google-cloud-bigquery>=3.20.0",
    "google-auth>=2.29.0",
    "looker-sdk>=24.4.0",
    "lkr-dev-cli[all]>=0.0.50",
    "mcp<2",
    "pydantic-monty<0.0.10",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
demo-create = "looker_demo_cli.cli:app"
looker-demo-cli = "looker_demo_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"

# ---------------------------------------------------------------------------
# Development tooling
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `-m "not integration"` keeps the default run hermetic: integration tests touch
# the live machine (gcloud, uv, real subprocesses) and cannot pass in a clean
# container. Run them explicitly with `pytest -m integration`.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not integration",
]
markers = [
    "unit: hermetic test with no network, no subprocess, and no host dependencies",
    "integration: requires a provisioned host (gcloud/uv/lkr) or real subprocess execution",
    "characterization: pins current observable CLI behavior to detect refactor regressions",
]

[tool.coverage.run]
source = ["looker_demo_cli"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PLE",  # pylint errors
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # Typer's entire API is function-call-in-default
    "RUF012",  # mutable class attrs without ClassVar (pydantic models)
]

[tool.ruff.lint.per-file-ignores]
# Status glyphs are deliberate UI, not typos.
"looker_demo_cli/utils/console.py" = ["RUF001"]
# The analyzer is loaded from `skills/` via a sys.path bootstrap that must run
# before the import it enables.
"tests/test_snowflake_analyzer.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
# Non-strict overall; the strictness ratchet is tightened per-module over time.
# See CONTRIBUTING.md and CRITQUE_REFACTOR_PLAN.md.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["^\\.venv/", "^dist/", "^tests/", "^skills/"]

