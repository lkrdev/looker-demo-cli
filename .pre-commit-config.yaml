default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^skills/
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--ignore-words-list=crate,nd,ans,fo]
        exclude: ^(uv\.lock|\.demo-state\.json)$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-secrets
        name: Check for Looker & GCP secrets
        entry: uv run python scripts/check_secrets.py
        language: system
        types: [text]
        exclude: ^tests/test_check_secrets\.py$

      - id: mypy
        name: mypy (looker_demo_cli)
        entry: uv run mypy looker_demo_cli
        language: system
        pass_filenames: false
        types: [python]

      - id: gen-docs-check
        name: CLI docs drift check (scripts/gen_docs.py)
        entry: uv run python scripts/gen_docs.py --check
        language: system
        pass_filenames: false
        files: ^(looker_demo_cli/|scripts/gen_docs\.py|docs/COMMANDS\.md)
